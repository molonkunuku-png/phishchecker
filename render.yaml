services:
  - type: web
    name: phishchecker
    runtime: python
    buildCommand: bash -lc 'cd frontend && npm install && npm run build && cd .. && pip install -r requirements.txt'
    startCommand: python -c "import os; from waitress import serve; from app import app; serve(app, listen='0.0.0.0:' + os.environ.get('PORT', '10000'))"
    envVars:
      - key: PORT
        value: "10000"
      - key: PHISHCHECKER_ENV
        value: production
      - key: SECRET_KEY
        value: ""
      - key: PHISHCHECKER_SECRET
        value: ""
